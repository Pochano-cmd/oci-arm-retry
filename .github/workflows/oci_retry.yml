name: OCI ARM Retry

on:
  workflow_dispatch:  # Manual trigger only

concurrency:
  group: oci-retry            # Only one Job allowed per group
  cancel-in-progress: false   # Do not cancel running jobs; new ones queue (max 1 running + 1 waiting)

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 355      # Close to GitHub Actions 6-hour limit
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Suppress Node.js 20 deprecation warning

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI SDK
        run: pip install oci

      - name: Set up OCI credentials
        env:
          OCI_USER:        ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY:     ${{ secrets.OCI_TENANCY }}
          OCI_REGION:      ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_PASSPHRASE:  ${{ secrets.OCI_PASSPHRASE }}
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          {
            echo "[DEFAULT]"
            echo "user=$OCI_USER"
            echo "fingerprint=$OCI_FINGERPRINT"
            echo "tenancy=$OCI_TENANCY"
            echo "region=$OCI_REGION"
            echo "key_file=/home/runner/.oci/oci_api_key.pem"
            echo "pass_phrase=$OCI_PASSPHRASE"
          } > ~/.oci/config
          chmod 600 ~/.oci/config
